<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>APK Store Pribadi</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <h1>📦 APK Store</h1>
  <p>Aplikasi buatan saya sendiri</p>
</header>

<main id="app-list"></main>

<footer>
  <p>© 2026 • My Private APK Store</p>
</footer>

<script>
fetch('apps.json')
  .then(res => res.json())
  .then(apps => {
    const container = document.getElementById('app-list');
    apps.forEach(app => {
      container.innerHTML += `
        <div class="card">
          <img src="${app.icon}" alt="${app.name}">
          <div class="info">
            <h2>${app.name}</h2>
            <p class="desc">${app.description}</p>
            <span class="version">v${app.version}</span>
            <a href="${app.url}" download>⬇ Download APK</a>
          </div>
        </div>
      `;
    });
  });
</script>

</body>
</html>
