<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>APK Saya</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<h1>📱 Koleksi APK Saya</h1>
<p>Aplikasi buatan sendiri (private)</p>

<div id="app-list"></div>

<script>
fetch('apps.json')
  .then(res => res.json())
  .then(apps => {
    const container = document.getElementById('app-list');
    apps.forEach(app => {
      container.innerHTML += `
        <div class="card">
          <h2>${app.name}</h2>
          <p>${app.description}</p>
          <p><b>Versi:</b> ${app.version}</p>
          <a href="${app.url}" download>⬇ Download APK</a>
        </div>
      `;
    });
  });
</script>

</body>
</html>
