<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>APK Store Pribadi</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="top">
  <h1>📦 APK Store</h1>
  <p>Koleksi aplikasi buatan saya</p>
</header>

<section class="grid" id="app-list"></section>

<script>
fetch('apps.json')
  .then(res => res.json())
  .then(apps => {
    const el = document.getElementById('app-list');

    apps.forEach(app => {
      el.innerHTML += `
        <div class="app-card">
          <img src="${app.icon}" class="app-icon" alt="${app.name}">
          
          <h2>${app.name}</h2>
          <span class="badge">v${app.version}</span>

          <p class="desc">${app.description}</p>

          <div class="actions">
            <a class="btn primary" href="${app.url}" download>⬇ APK</a>
            <a class="btn secondary" href="${app.note}" download>📝 TXT</a>
          </div>
        </div>
      `;
    });
  });
</script>

</body>
</html>
